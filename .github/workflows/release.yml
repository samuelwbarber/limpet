name: Release

# Push a tag matching app/package.json's version (e.g. v0.1.1) to build the
# Windows installer, macOS disk images and Linux AppImages and publish them, with the
# latest.yml / latest-mac.yml + .blockmap files the installed apps' auto-updater
# reads, as one GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v0.1.2)
        required: true
        type: string
      platform:
        description: Platforms to rebuild
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

# Manual recovery uses this workflow from main but builds the immutable tag's
# product sources. Never move the tag to repair release infrastructure.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    name: Build and publish installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Electron 44's npm package needs >= 22.12
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag matches package version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:RELEASE_TAG) { throw "tag $env:RELEASE_TAG != package.json version v$v" }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing; unsigned when these secrets aren't set.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          # An empty CSC link is interpreted as a certificate path by the builder.
          foreach ($name in @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD')) {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
          }
          npx electron-builder --win --publish always

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    name: Build and publish macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag matches package version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$RELEASE_TAG" ] || { echo "tag $RELEASE_TAG != package.json version v$v"; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: node-pty's spawn helper must be executable (it is packaged as is)
        run: chmod +x node_modules/node-pty/prebuilds/*/spawn-helper node_modules/node-pty/build/Release/spawn-helper 2>/dev/null || true
      - name: Unit tests
        run: npm test
      - name: Build and publish (dmg + zip, arm64 and x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Developer ID signing and notarization; unsigned when the
          # secrets aren't set (the README tells users how to open it).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty secrets must be absent, not empty certificate paths.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          extra=()
          if [ -z "${CSC_LINK:-}" ]; then
            echo 'No signing certificate: building unsigned.'
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          elif [ -n "${APPLE_ID:-}" ]; then
            echo 'Signing and notarizing.'
            extra+=(--config.mac.notarize=true)
          else
            echo 'Signing without notarization (no APPLE_ID).'
          fi
          npx electron-builder --mac --publish always "${extra[@]}"

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    name: Build Linux AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag matches package version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$RELEASE_TAG" ] || { echo "tag $RELEASE_TAG != package.json version v$v"; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure bundled PTY helpers are executable
        run: find node_modules/node-pty -name spawn-helper -type f -exec chmod +x {} +
      - name: Unit tests
        run: npm test
      - name: Verify native PTY
        run: node -e "const p=require('node-pty').spawn('/bin/sh',['-c','exit 0']); p.onExit(e=>process.exit(e.exitCode));"
      - name: Build and publish AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --${{ matrix.arch }} --publish always
