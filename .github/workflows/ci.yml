name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  module:
    name: PowerShell module (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Module manifest is valid
        shell: powershell # Windows PowerShell 5.1 -- what the module targets
        run: Test-ModuleManifest .\shell\Limpet.psd1 | Out-Null
      - name: Alias takeover diagnostics
        shell: powershell
        run: |
          Import-Module .\shell\Limpet.psd1 -Force
          Get-Alias ls, rm, cp, mv, cat -ErrorAction SilentlyContinue | Format-Table Name, Definition, Options
      - name: Command suite (aliases, flags, peek/reels protocol, Hello)
        shell: powershell
        run: .\tests\Test-Limpet.ps1
      - name: xssh suite (bootstrap variants, reconnect policy)
        shell: powershell
        run: .\tests\Test-Xssh.ps1

  remote-sh:
    name: Remote helpers (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tmux (for the resume-bootstrap test)
        run: command -v tmux >/dev/null || sudo apt-get install -y -qq tmux
      - name: Helper + bootstrap suite
        run: bash tests/test-remote-sh.sh

  shell-unix:
    name: Shell integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure zsh, tmux and lsof
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zsh tmux lsof
          else
            command -v tmux >/dev/null || brew install -q tmux
          fi
          zsh --version; bash --version | head -n 1; tmux -V; command -v lsof
      - name: Shell suite under zsh
        run: zsh tests/test-limpet-sh.sh
      - name: Shell suite under bash
        run: bash tests/test-limpet-sh.sh
      - name: Remote helpers + bootstrap suite
        run: bash tests/test-remote-sh.sh

  unit-linux:
    name: App unit tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies (pure JS only; no native builds)
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Unit tests
        run: npm test

  unit-mac:
    name: App unit tests (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies (pure JS only; no native builds)
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Unit tests
        run: npm test

  app:
    name: Electron app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Electron 44's npm package needs >= 22.12
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies (validates native modules on Windows)
        run: npm ci --no-audit --no-fund
      - name: Parse-check sources
        run: Get-ChildItem src -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Protocol unit tests
        run: npm test
      - name: End-to-end (launch app, peek, resize, reels, download)
        run: npm run test:e2e

  app-mac:
    name: Electron app (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies (validates node-pty's darwin prebuild)
        run: npm ci --no-audit --no-fund
      - name: Parse-check sources
        run: for f in src/*.js; do node --check "$f"; done
      - name: Protocol unit tests
        run: npm test
      - name: End-to-end (launch app, peek, resize, reels, download, accounts)
        env:
          LIMPET_SHELL: /bin/zsh
        run: npm run test:e2e
