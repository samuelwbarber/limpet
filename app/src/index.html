<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; frame-src https:" />
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="settings.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e2e; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #tabbar {
      flex: 0 0 34px; display: flex; align-items: center; gap: 2px;
      background: #181825; padding: 0 4px; user-select: none;
    }
    #tabstrip { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; height: 100%; }
    .tab {
      display: flex; align-items: center; gap: 6px; height: 26px;
      padding: 0 4px 0 12px; border-radius: 6px; min-width: 0; max-width: 220px;
      color: #a6adc8; cursor: grab;
      font: 12px 'Cascadia Mono', Consolas, monospace;
    }
    .tab.dragging { opacity: 0.65; cursor: grabbing; }
    .tab.generating { animation: backdrop-pulse 1.8s ease-in-out infinite; }
    @keyframes backdrop-pulse {
      0%, 100% { box-shadow: inset 0 -2px rgba(137,180,250,0.15); }
      50% { box-shadow: inset 0 -2px rgba(137,180,250,0.9); }
    }
    .tab:hover:not(.active) { background: #232336; }
    .tab.active { background: #313244; color: #cdd6f4; }
    .tab .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .close {
      flex: 0 0 auto; border: 0; background: transparent; color: inherit;
      font: 13px 'Cascadia Mono', Consolas, monospace; cursor: pointer;
      border-radius: 4px; padding: 1px 5px;
    }
    .tab .close:hover { background: #45475a; color: #f38ba8; }
    #newtab {
      flex: 0 0 auto; border: 0; background: transparent; color: #a6adc8;
      font: 15px 'Cascadia Mono', Consolas, monospace; cursor: pointer;
      border-radius: 6px; padding: 2px 9px;
    }
    #newtab:hover { background: #313244; color: #cdd6f4; }
    #main { flex: 1 1 auto; display: flex; min-height: 0; }
    #terms { position: relative; flex: 1 1 auto; min-width: 0; }
    .term-pane {
      position: absolute; inset: 0; padding: 6px; display: none;
      background-color: #1e1e2e; background-size: cover; background-position: center;
      image-rendering: pixelated;
    }
    .term-pane.active { display: block; }
    /* hide xterm's own scrollbar (the thin bar on the terminal's right edge) */
    .xterm-viewport::-webkit-scrollbar { width: 0 !important; height: 0 !important; }
    .xterm-viewport { scrollbar-width: none !important; }
    #reels {
      flex: 0 0 40%; display: none; height: 100%;
      background: #1e1e2e;
    }
    #reels.show { display: block; }
    #reels webview { width: 100%; height: 100%; border: 0; background: #1e1e2e; }
    #drop {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(137,180,250,0.12); border: 2px dashed #89b4fa; z-index: 5;
      color: #89b4fa; font: 16px 'Cascadia Mono', Consolas, monospace; pointer-events: none;
    }
    #drop.show { display: flex; }
    /* right-click a tab: which Claude account the chat runs under */
    .account-menu {
      position: absolute; z-index: 20; min-width: 380px; padding: 4px;
      background: #181825; border: 1px solid #313244; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); color: #cdd6f4;
      font: 12px 'Cascadia Mono', Consolas, monospace; user-select: none;
    }
    .account-menu .head { padding: 6px 10px 4px; color: #6c7086; white-space: nowrap; }
    .account-menu .item {
      display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; align-items: baseline; gap: 14px;
      padding: 6px 10px; border-radius: 5px; cursor: pointer;
    }
    .account-menu .item:hover { background: #313244; }
    .account-menu .item.current, .account-menu .item.current .who { color: #a6e3a1; }
    .account-menu .item.current .name::after { content: ' ●'; }
    .account-menu .who { color: #a6adc8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-menu .usage { color: #6c7086; white-space: nowrap; font-variant-numeric: tabular-nums; justify-self: end; }
    .account-menu .usage.ok { color: #a6e3a1; }
    .account-menu .usage.mid { color: #f9e2af; }
    .account-menu .usage.low { color: #f38ba8; }
    .account-menu .none { padding: 6px 10px; color: #6c7086; font-style: italic; }
    .account-menu .more { padding: 4px 10px 6px; color: #6c7086; white-space: nowrap; }
    .account-menu .more:empty { display: none; }
    .account-menu.busy .item { pointer-events: none; opacity: 0.55; }
    .account-menu .bg { display: flex; align-items: center; gap: 7px; padding: 8px 10px 6px; margin-top: 4px; border-top: 1px solid #313244; }
    .account-menu .bg .label { color: #6c7086; margin-right: 4px; }
    .account-menu .swatch { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #45475a; padding: 0; cursor: pointer; }
    .account-menu .swatch:hover { border-color: #a6adc8; }
    .account-menu .swatch.selected { border-color: #cdd6f4; box-shadow: 0 0 0 1px #cdd6f4; }
    .account-menu .gen {
      margin-left: auto; border: 1px solid #45475a; background: transparent; color: #a6adc8;
      border-radius: 5px; padding: 2px 8px; cursor: pointer; font: inherit;
    }
    .account-menu .gen:hover { background: #313244; color: #cdd6f4; }
    .account-menu .gen.selected { border-color: #a6e3a1; color: #a6e3a1; }
    /* the tab's agent hit its usage limit: offer another account (failover-banner.js) */
    .failover-banner {
      position: absolute; right: 14px; bottom: 14px; z-index: 6; width: min(360px, calc(100% - 28px));
      padding: 10px 12px; border-radius: 8px; box-sizing: border-box; user-select: none;
      background: #181825; border: 1px solid #313244; border-left: 3px solid #f9e2af; color: #cdd6f4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); font: 12px 'Cascadia Mono', Consolas, monospace;
    }
    .failover-banner .text { line-height: 1.45; overflow-wrap: anywhere; }
    .failover-banner .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .failover-banner button {
      font: inherit; color: #cdd6f4; background: transparent; cursor: pointer;
      border: 1px solid #45475a; border-radius: 6px; padding: 2px 10px;
    }
    .failover-banner button:hover { background: #313244; }
    .failover-banner button.move { background: #89b4fa; border-color: #89b4fa; color: #11111b; }
    .failover-banner button.move:hover { background: #b4befe; border-color: #b4befe; }
    .failover-banner.busy button { pointer-events: none; opacity: 0.55; }
    /* Generative picked before its model is installed: ask, then show progress */
    .setup-overlay {
      position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      background: rgba(17,17,27,0.6);
    }
    .setup-prompt, .setup-notice {
      background: #181825; border: 1px solid #313244; color: #cdd6f4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); font: 12px 'Cascadia Mono', Consolas, monospace;
    }
    .setup-prompt { width: min(460px, calc(100vw - 32px)); padding: 16px 18px 14px; border-radius: 10px; }
    .setup-prompt .title { font-size: 14px; margin-bottom: 10px; }
    .setup-prompt p { margin: 0 0 8px; color: #a6adc8; line-height: 1.5; }
    .setup-prompt p.where { color: #6c7086; overflow-wrap: anywhere; }
    .setup-prompt .actions, .setup-notice .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .setup-prompt .actions { margin-top: 14px; }
    .setup-prompt button, .setup-notice button {
      font: inherit; color: #cdd6f4; background: transparent; cursor: pointer;
      border: 1px solid #45475a; border-radius: 6px; padding: 4px 12px;
    }
    .setup-prompt button:hover, .setup-notice button:hover { background: #313244; }
    .setup-prompt button.install { background: #89b4fa; border-color: #89b4fa; color: #11111b; }
    .setup-prompt button.install:hover { background: #b4befe; border-color: #b4befe; }
    .setup-prompt button:focus-visible, .setup-notice button:focus-visible { outline: 2px solid #cdd6f4; outline-offset: 1px; }
    .setup-notice {
      position: fixed; right: 14px; bottom: 14px; z-index: 25; width: min(340px, calc(100vw - 28px));
      padding: 10px 12px; border-radius: 8px; box-sizing: border-box;
    }
    .setup-notice .head { margin-bottom: 4px; }
    .setup-notice .text { color: #a6adc8; line-height: 1.45; overflow-wrap: anywhere; }
    .setup-notice[data-state="error"] .text { color: #f38ba8; }
    .setup-notice .bar { height: 4px; margin-top: 8px; border-radius: 2px; background: #313244; overflow: hidden; }
    .setup-notice .fill { height: 100%; width: 0; background: #89b4fa; transition: width 0.4s; }
    .setup-notice .actions { margin-top: 8px; }
    .setup-notice button { padding: 2px 10px; }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="tabstrip"></div>
    <button id="newtab" title="New tab (Ctrl+Shift+T)">+</button>
  </div>
  <div id="main">
    <div id="terms"></div>
    <div id="reels">
      <webview id="reels-view" partition="persist:instagram" allowpopups
               useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"></webview>
    </div>
  </div>
  <div id="drop">drop to paste files into the current session</div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-image/lib/addon-image.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="predict.js"></script>
  <script src="settings-ui.js"></script>
  <script src="renderer.js"></script>
  <script src="failover-banner.js"></script>
</body>
</html>
